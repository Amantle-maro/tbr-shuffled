<!DOCTYPE html>
<html lang="en">
<head>
    <title>Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Corben:wght@400;700&family=Krona+One&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body{
        background-color: #99bdc1;     
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    p{
        color: #121212;
        font-size: 20px;
        font-family: "Corben", serif;
        font-weight: 400;
        font-style: normal;
        text-align: center;
    }
    h1{
        color: black;
        font-family: "Krona One", sans-serif;
        font-size: 24px;
        margin: 0;
        text-align: center;
        }
     div{background-color: #FAFAFA;
        padding: 16px 32px;
        border: none;
        border-radius: 12px;
        width: 80%; 
        height: 60%;
        align-content: center;
        margin-bottom: 12px; 
        }

        /* mobile */

        @media (max-width: 768px) {
        h1{
        color: black;
        font-family: "Krona One", sans-serif;
        font-size: 20px;
        margin: 0;
        font-weight: 400;
        font-style: normal;
        text-align: center;}
        p{
        color: #000000;
        font-size: 16px;
        font-family: "Corben", serif;
        font-weight: 400;
        font-style: normal;
        text-align: center;}
        }
    .retry{
        padding: 16px 32px;
        font-family: "Krona One", sans-serif;
        width: 50%;
        background-color: #FDFA98;
        color: black;
        border: none;
        font-size: 12px;
        cursor: pointer;
        margin-top:12px;}
</style>
</head>
<body>
    <div> 
    <h1 id="bookTitle"></h1>
    <p id="bookAuthor"></p>
    </div>
    <button id="retry" class="retry"> Not feeling it </button>
    <script src="script.js"></script>
</body>
</html>
